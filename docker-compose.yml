version: "3.8"

services:
  iseeyou:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - ISEEYOU_SECRET=${ISEEYOU_SECRET}
      - ISEEYOU_ADMIN_PASS_HASH=${ISEEYOU_ADMIN_PASS_HASH}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      - redis
    # Security: Minimal required capabilities
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Security: Drop all capabilities except required ones
    cap_drop:
      - ALL
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security: Read-only root filesystem except for required paths
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/log/iseeyou
      - /tmp/iseeyou_captures
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    # Security: Restart policy
    restart: unless-stopped
    # Security: Health check
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    # Security: Redis configuration
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Security: No capabilities needed for Redis
    cap_drop:
      - ALL
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
      - /data
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    # Security: Volume for persistence (if needed)
    volumes:
      - redis_data:/data
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local
